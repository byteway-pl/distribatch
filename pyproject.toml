[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "distribatch"
dynamic = ["version"]
description = "Batch LLM generation, embeddings and speech transcription over DataFrames with Spark or multiprocessing — Unity Catalog, local/Volume weights or OpenAI-compatible APIs"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Adrian Galik" }]
keywords = ["llm", "batch", "inference", "embeddings", "whisper", "speech-to-text", "spark", "databricks", "vllm", "unity-catalog"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
# Core stays light: every heavy dependency is an extra and imported lazily.
dependencies = [
    "pydantic>=2.0",
    "pandas>=1.5",
    "pyarrow>=12",
    "cloudpickle>=2.2",
]

[project.optional-dependencies]
# pyspark is preinstalled on Databricks — only needed elsewhere.
spark = ["pyspark>=3.5"]
openai = ["openai>=1.40"]
transformers = ["torch>=2.1", "transformers>=4.44", "accelerate>=0.33"]
audio = ["soundfile>=0.12", "scipy>=1.10"]
whisper = ["faster-whisper>=1.0"]
vllm = ["vllm>=0.6"]
mlflow = ["mlflow-skinny>=2.16"]
databricks = ["databricks-sdk>=0.30"]
all = ["distribatch[spark,openai,transformers,audio,whisper,vllm,mlflow,databricks]"]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.10",
    "pandas-stubs",
    "pyspark>=3.5",
    "openai>=1.40",
]

[project.urls]
Homepage = "https://github.com/byteway-pl/distribatch"
Issues = "https://github.com/byteway-pl/distribatch/issues"

[tool.hatch.version]
path = "src/distribatch/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/distribatch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "spark: needs a local pyspark session (Java 17); skipped when Java is unavailable",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "TID"]

[tool.ruff.lint.per-file-ignores]
# Databricks notebook sources: imports follow %pip cells; spark/dbutils are notebook globals.
"examples/*" = ["E402", "F821"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/distribatch"]
plugins = ["pydantic.mypy"]

# Optional heavy deps are not installed in dev/CI.
[[tool.mypy.overrides]]
module = [
    "torch.*", "vllm.*", "transformers.*", "mlflow.*", "databricks.*",
    "soundfile.*", "scipy.*", "faster_whisper.*", "ctranslate2.*", "cloudpickle.*", "pyarrow.*",
    "huggingface_hub.*",
]
ignore_missing_imports = true
