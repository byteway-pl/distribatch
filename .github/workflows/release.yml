name: Release to PyPI

# Publishes via PyPI Trusted Publishing (OIDC) — no API tokens stored anywhere.
# Triggered by pushing a version tag, e.g.:  git tag v0.1.0 && git push --tags

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Verify tag matches package version
        run: |
          VERSION=$(python -c "import re,pathlib; print(re.search(r'__version__ = \"(.+?)\"', pathlib.Path('src/distribatch/__init__.py').read_text()).group(1))")
          [ "v${VERSION}" = "${GITHUB_REF_NAME}" ] \
            || { echo "Tag ${GITHUB_REF_NAME} != package version v${VERSION}"; exit 1; }
      - name: Smoke-test the wheel in a clean venv
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install dist/*.whl
          /tmp/smoke/bin/python -c "import distribatch; print(distribatch.__version__)"

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # required for PyPI Trusted Publishing (OIDC)
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
